[package]
name = "docx-to-md"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
calamine = "0.26"
cfb = "0.10"
clap = { version = "4", features = ["derive"] }
csv = "1"
pdf-extract = "0.8"
roxmltree = "0.20"
zip = "2"

[lints.clippy]
all = "deny"
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"
nursery = { level = "warn", priority = -1 }
